name: Build TradeLab APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          set -e
          mkdir -p .buildsrc
          declare -A MAP
          MAP["app__build.gradle"]="app/build.gradle"
          MAP["app__src__main__AndroidManifest.xml"]="app/src/main/AndroidManifest.xml"
          MAP["app__src__main__java__com__tradelab__mobile__MainActivity.java"]="app/src/main/java/com/tradelab/mobile/MainActivity.java"
          MAP["app__src__main__res__values__colors.xml"]="app/src/main/res/values/colors.xml"
          MAP["app__src__main__res__values__strings.xml"]="app/src/main/res/values/strings.xml"
          MAP["app__src__main__res__values__styles.xml"]="app/src/main/res/values/styles.xml"
          MAP["build.gradle"]="build.gradle"
          MAP["settings.gradle"]="settings.gradle"
          MAP["gradle.properties"]="gradle.properties"

          for src in "${!MAP[@]}"; do
            if [ -f "$src" ]; then
              mkdir -p "$(dirname "${MAP[$src]}")"
              cp "$src" "${MAP[$src]}"
            fi
          done

          # Copy any additional uploaded app/project files preserving their encoded path.
          for f in *_*; do
            [ -f "$f" ] || continue
            case "$f" in
              app__*) ;;
              *) continue ;;
            esac
          done

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TradeLab-v1-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeLab-v1-APK
          path: TradeLab-v1-debug.apk
          if-no-files-found: error
          retention-days: 30
