name: Build TradeLab APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p app/src/main/java/com/tradelab/mobile
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cp app__build.gradle app/build.gradle
          cp app__src__main__AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp app__src__main__java__com__tradelab__mobile__MainActivity.java app/src/main/java/com/tradelab/mobile/MainActivity.java
          cp app__src__main__res__values__colors.xml app/src/main/res/values/colors.xml
          cp app__src__main__res__values__strings.xml app/src/main/res/values/strings.xml
          cp app__src__main__res__values__styles.xml app/src/main/res/values/styles.xml
          cp app__src__main__res__drawable__ic_tradelab.png app/src/main/res/drawable/ic_tradelab.png

          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/drawable/ic_tradelab.png

          echo "Android project reconstructed successfully."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify project
        run: gradle --no-daemon projects

      - name: Build TradeLab APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TradeLab-v1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeLab-v1-APK
          path: TradeLab-v1-debug.apk
          if-no-files-found: error
          retention-days: 30
