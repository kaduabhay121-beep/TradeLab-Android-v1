plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tradelab.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tradelab.mobile'
        minSdk 23

        // IMPORTANT:
        // Keep target below Android 15 edge-to-edge enforcement.
        // This APK is sideloaded, not being submitted to Google Play.
        targetSdk 34

        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }

        debug {
            minifyEnabled false
        }
    }
}
